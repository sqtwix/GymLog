services:
  
  backend:
    build: 
      context: .
      dockerfile: .\GymLogCore\GymLogCore\Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Database connection settings for the application
      - SPRING_DATASOURCE_URL=${DOCKER_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${APP_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${APP_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      
      # For flyway migrations, we use the admin credentials to ensure the migration can be applied successfully
      - SPRING_FLYWAY_URL=${DOCKER_DB_URL}
      - SPRING_FLYWAY_USER=${DB_ADMIN_USER}
      - SPRING_FLYWAY_PASSWORD=${DB_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymlogdb
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymlogdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: